name: Build and release

on:
  push:
    tags:
      - "v*"
    branches:
      - mac-app # test builds of the Mac app (published as a separate "Mac beta" pre-release)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    permissions:
      contents: write # needed only to publish the release
    steps:
      # actions are pinned to exact commits so a moved tag can't change what builds the exe
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (HTML + native launcher)
        run: node build.js
        env:
          CI: "true"

      - name: Package (plain file names + zip + checksums)
        shell: pwsh
        run: |
          Copy-Item "dist/Mark's Render PDF Editor.exe" "dist/MarksRenderPDFEditor.exe"
          Copy-Item "dist/Mark's Render PDF Editor.exe" "dist/MarksRenderPDFEditor-Setup.exe"  # same program; the name makes it install
          Compress-Archive -Path "dist/MarksRenderPDFEditor.exe" -DestinationPath "dist/MarksRenderPDFEditor-windows.zip" -Force
          Get-FileHash dist/MarksRenderPDFEditor.exe, dist/MarksRenderPDFEditor-Setup.exe, dist/MarksRenderPDFEditor-windows.zip, dist/PDFEditor.html -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marks-render-pdf-editor
          path: |
            dist/MarksRenderPDFEditor-Setup.exe
            dist/MarksRenderPDFEditor.exe
            dist/MarksRenderPDFEditor-windows.zip
            dist/PDFEditor.html
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            dist/MarksRenderPDFEditor-Setup.exe
            dist/MarksRenderPDFEditor.exe
            dist/MarksRenderPDFEditor-windows.zip
            dist/PDFEditor.html
            dist/SHA256SUMS.txt

  mac:
    name: macOS
    runs-on: macos-latest
    needs: build # the Windows job creates the release; this one adds the Mac download to it
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the editor page
        run: node build.js

      - name: Build the Mac app and disk image
        run: |
          chmod +x mac/build-mac.sh
          if ! mac/build-mac.sh; then
            # show compiler errors as readable annotations on the run
            sed -nE 's/^(.*\.swift):([0-9]+):([0-9]+): error: (.*)$/::error file=mac\/main.swift,line=\2,col=\3::\4/p' dist/swift.log
            exit 1
          fi
          shasum -a 256 dist/MarksRenderPDFEditor-mac.dmg | sed 's# dist/# #' > dist/SHA256SUMS-mac.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: marks-render-pdf-editor-mac
          path: dist/MarksRenderPDFEditor-mac.dmg

      - name: Add to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/MarksRenderPDFEditor-mac.dmg
            dist/SHA256SUMS-mac.txt

      - name: Publish Mac beta (test builds)
        if: github.ref == 'refs/heads/mac-app'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: mac-beta
          target_commitish: ${{ github.sha }}
          name: Mac beta (for testing)
          prerelease: true
          body: |
            Test build of the Mac app. Not the official release yet.
            Download MarksRenderPDFEditor-mac.dmg, open it and drag the app onto Applications.
            First launch: macOS says the app can't be verified. Open System Settings → Privacy & Security, scroll down and click "Open Anyway" (one time only).
          files: |
            dist/MarksRenderPDFEditor-mac.dmg
            dist/SHA256SUMS-mac.txt
